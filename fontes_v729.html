$("doiBtn").onclick = function(){
  var doi = ($("doiInput").value || "").trim();
  if (!doi) { say(FR ? "Saisir un DOI." : "Enter a DOI first."); return; }
  say(FR ? "Recherche…" : "Looking up…");
  var xhr = new XMLHttpRequest();
  xhr.open("GET", "https://api.crossref.org/works/" + encodeURIComponent(doi), true);
  xhr.onreadystatechange = function(){
    if (xhr.readyState !== 4) return;
    if (xhr.status !== 200) { say(FR ? "DOI introuvable." : "DOI not found."); return; }
    try {
      var msg = JSON.parse(xhr.responseText);
      var m = msg.message;
      if (m.author) {
        var au = m.author.map(function(a){ return (a.family||"") + ", " + (a.given||""); }).join("; ");
        $("f_author").value = au;
      }
      if (m.title && m.title[0]) $("f_title").value = m.title[0];
      if (m["container-title"] && m["container-title"][0]) $("f_container").value = m["container-title"][0];
      if (m.volume) $("f_vol").value = m.volume;
      if (m.issue) $("f_iss").value = m.issue;
      if (m["published-print"] && m["published-print"]["date-parts"]) $("f_year").value = m["published-print"]["date-parts"][0][0];
      else if (m["published-online"] && m["published-online"]["date-parts"]) $("f_year").value = m["published-online"]["date-parts"][0][0];
      if (m.page) $("f_pages").value = m.page;
      if (m.URL) $("f_url").value = m.URL;
      if (m.publisher) $("f_pub").value = m.publisher;
      var dt = (m.type || "").indexOf("journal") >= 0 ? "article" : (m.type||"").indexOf("book") >= 0 ? "book" : "article";
      $("f_type").value = dt;
      applyType();
      say(FR ? "Rempli depuis CrossRef." : "Filled from CrossRef.");
    } catch(e) { say(FR ? "Erreur d'analyse." : "Parse error."); }
  };
  xhr.onerror = function(){ say(FR ? "Échec du réseau." : "Network failed."); };
  xhr.send();
};

bibExportBtn.type = "button";
bibExportBtn.className = "small";
bibExportBtn.textContent = FR ? "Exporter BibTeX" : "Export BibTeX";
bibExportBtn.onclick = function(){
  var sources = load();
  if (!sources.length) { say(L.noSources); return; }
  var bib = INK ? INK.exportText("bib") : sources.map(function(s){ return fmtBibTeX(s); }).join("\n\n");
  downloadText(bib, "fontes.bib", FR ? "BibTeX export\u00E9." : "BibTeX exported.");
};
function downloadText(text, name, done){
  try {
    var blob = new Blob([text], {type:"text/plain;charset=utf-8"});
    var url = URL.createObjectURL(blob);
    var link = document.createElement("a");
    link.href = url;
    link.download = name;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    setTimeout(function(){ try{URL.revokeObjectURL(url);}catch(e){} }, 1500);
    say(done);
  } catch(e) { say(L.noDl); }
}
try { $("bibBar").appendChild(bibExportBtn); } catch(e){}
/* RIS and CSL-JSON, for Zotero, EndNote, Mendeley and others (inside Inkwell) */
if (INK) {
  [["ris", "Export RIS", "fontes.ris"], ["json", "Export CSL-JSON", "fontes.json"]].forEach(function (k) {
    var b = document.createElement("button"); b.type = "button"; b.className = "small"; b.textContent = k[1];
    b.onclick = function () { if (!load().length) { say(L.noSources); return; } downloadText(INK.exportText(k[0]), k[2], (FR ? "Export\u00E9." : "Exported.")); };
    try { $("bibBar").appendChild(b); } catch (e) {}
  });
}

  function dialog(opts) {
    var o = opts || {}, doc = o.doc || root.document;
    css(doc);
    var old = doc.getElementById('iwDlg'); if (old) old.remove();
    var back = doc.createElement('div');
    back.id = 'iwDlg'; back.className = 'iw-dlg-back' + (o.night && o.night() ? ' iw-night' : '');

    function shut() { back.remove(); doc.removeEventListener('keydown', key, true); if (o.onClose) o.onClose(); }
    function key(e) { if (e.key === 'Escape') { e.stopPropagation(); shut(); } }
    back.addEventListener('click', function (e) { if (e.target === back || (e.target.closest && e.target.closest('.iw-x'))) shut(); });

    wire(back.querySelector('.iw-panel'), o);
    try { back.querySelector('.iw-sw').focus(); } catch (e) {}
    return back;
  }

  /* a room's whole share: o {app, doc, night(), base, after(), slot,
     btnClass, noteSlot, noteClass, key(), here(), go(rec), worth(rec)}.
     Comfort is applied now and on every change; the place is kept as the

  function room(o) {
    var doc = o.doc || root.document, last = '', nb = null, shown = false, wt = 0;
    function night() { try { return !!(o.night && o.night()); } catch (e) { return false; } }
    function comfort() {

      if (k === last) return; last = k;

      try { if (o.after) o.after(); } catch (e) {}

    function soon() { if (!get().where.on) return; clearTimeout(wt); wt = setTimeout(keep, 1500); }

      b.textContent = o.btnText || 'My way of working'; b.title = 'Reading comfort, where you were, and three at a time';
      b.addEventListener('mousedown', function (e) { e.preventDefault(); });

      nb.hidden = !get().where.on;

      nb.addEventListener('click', function () { keep(); var k = o.key(), r = load(o.app, k) || {}; noteBox({ doc: doc, night: night(), note: r.note || '', onSave: function (v) { keep(); note(o.app, k, v); } }); });

    on(function (g) { comfort(); quiet(doc); rul(); if (nb) nb.hidden = !g.where.on; if (o.changed) o.changed(g); });
    quiet(doc);
    if (o.ruler) { doc.addEventListener('selectionchange', rul); doc.addEventListener('input', rul, true); }

    doc.addEventListener('input', soon, true);
    root.addEventListener('scroll', soon, { passive: true });
    doc.addEventListener('visibilitychange', function () { if (doc.visibilityState === 'hidden') keep(); });
    root.addEventListener('pagehide', keep);
    function offer() {
      if (shown || !get().where.on) return;
      var k = o.key(), r = load(o.app, k);
      if (!r || (!r.note && !(o.worth ? o.worth(r) : true))) return;
      shown = true;
      card({ doc: doc, night: night(), rec: r, label: o.label ? o.label(r) : null, onGo: function () { try { o.go(r); } catch (e) {} }, onNoteDone: function () { note(o.app, k, ''); } });

<script>(function(){
/* 7.44: My way of working in Fontes (INKWAY): the button in the heading,
   Reading comfort on the sources and the fields, and Where was I?: the source
   you were adding (its fields come back) or the place in your list */
var W=window.INKWAY;if(!W)return;
function $(id){return document.getElementById(id);}
function night(){return document.documentElement.classList.contains('cd-dark');}
var IDS=['f_type','f_author','f_title','f_container','f_editor','f_city','f_pub','f_vol','f_iss','f_year','f_pages','f_url','f_acc','f_tags','f_notes'];

  base:{size:15,line:1.6,font:'var(--serif)'},
  slot:head,noteSlot:head,
  key:function(){return 'library';},
  here:function(){
    var d={},any=false;
    IDS.forEach(function(id){var e=$(id);if(!e)return;d[id]=e.value;if(id!=='f_type'&&e.value.trim())any=true;});
    var q=$('srcSearch')?$('srcSearch').value:'',row=rowIn(),rs=row?W.cut((row.querySelector('.ref')||row).textContent,110):'';
    if(any)return {draft:d,q:q,row:rs,snip:W.cut([d.f_author,d.f_title,d.f_year].filter(Boolean).join(', '),110),label:'adding a source'+(d.f_title.trim()?', “'+W.cut(d.f_title,60)+'”':'')};
    if(!rs&&!q)return null;
    return {draft:null,q:q,row:rs,snip:rs,label:q?'in your sources, searching for “'+W.cut(q,40)+'”':'in your sources'};
  },
  worth:function(r){return !!(r.draft||r.row||r.q);},
  go:function(r){
    var s=$('srcSearch');
    if(s&&r.q&&s.value!==r.q){s.value=r.q;s.dispatchEvent(new Event('input',{bubbles:true}));}
    if(r.draft){var first=null;IDS.forEach(function(id){var e=$(id);if(!e||r.draft[id]==null)return;if(!e.value||id==='f_type')e.value=r.draft[id];});
      ['f_author','f_title','f_year','f_pub','f_city','f_pages'].some(function(id){var e=$(id);if(e&&!e.value.trim()){first=e;return true;}return false;});
      var f=first||$('f_title');if(f){f.scrollIntoView({block:'center'});try{f.focus({preventScroll:true});}catch(e){f.focus();}}

  }
});
})();</script>
