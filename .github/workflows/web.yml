name: Build the Inkwell web app

# Builds the home-screen web app (for iPhone and iPad through Safari's
# Add to Home Screen, or any browser) from the same Inkwell.html as the apps,
# and publishes it as a zip. Publishing it at a web address is a separate
# choice: see the READ ME beside build_site.py.
#
# The files are found wherever they sit: build_site.py (with icons/ and
# VERSION.txt beside it), and the first folder holding Inkwell.html together
# with vendor/transformers.min.js.

on:
  push:
    branches: [ main, 'claude/**' ]
    paths-ignore:
      - 'Inkwell-Android/app/src/main/java/**'
      - 'Inkwell-Android/app/src/main/res/**'
      - 'Inkwell-Android/*.gradle'
      - 'Inkwell-iOS/**'
      - 'artwork/**'
      - 'Inkwell-Mac/**'
      - 'Inkwell-Windows/**'
      - 'packaging/**'
      - '.github/workflows/main.yml'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the project
        uses: actions/checkout@v4

      - name: Build the web app
        run: |
          set -euo pipefail
          script="$(find . -maxdepth 3 -name build_site.py -not -path './.git/*' | sort | head -n 1)"
          if [ -z "$script" ]; then
            echo "::error::No build_site.py in this repository. Upload everything inside the web app package."
            exit 1
          fi
          src=""
          while IFS= read -r f; do
            d="$(dirname "$f")"
            if [ -f "$d/vendor/transformers.min.js" ]; then src="$d"; break; fi
          done < <(find . -maxdepth 6 -name Inkwell.html -not -path './.git/*' -not -path './site/*' | sort)
          if [ -z "$src" ]; then
            echo "::error::No Inkwell.html with a vendor folder beside it. Upload the web folder from the package."
            exit 1
          fi
          version="$(tr -d '[:space:]' < "$(dirname "$script")/VERSION.txt" 2>/dev/null || true)"
          echo "build script: $script; web app from: $src; version ${version:-unknown}"
          python3 "$script" "$src" site "${version:-unknown}"
          zip_name="Inkwell-${version:-unknown}-web-build${{ github.run_number }}.zip"
          (cd site && zip -qr "../$zip_name" .)
          {
            echo "INKWELL_VERSION=${version:-unknown}"
            echo "ZIP_NAME=$zip_name"
          } >> "$GITHUB_ENV"
          ls -la site "$zip_name"

      - name: Keep the web app with this run
        uses: actions/upload-artifact@v4
        with:
          name: Inkwell-Web
          path: ${{ env.ZIP_NAME }}
          if-no-files-found: error

      - name: Publish a release you can download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="web-build-${{ github.run_number }}"
          title="Inkwell ${INKWELL_VERSION} web app (build ${{ github.run_number }})"
          notes="The home-screen web app. Unzip it and publish the folder at a web address (see Inkwell-Web/READ ME.txt), then open that address in Safari and choose Share, Add to Home Screen. Built from commit ${{ github.sha }}."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$ZIP_NAME" --clobber
          else
            gh release create "$tag" "$ZIP_NAME" --target "${{ github.sha }}" --title "$title" --notes "$notes"
          fi
