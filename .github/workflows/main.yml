name: Build Inkwell for Android

# Builds the Fire tablet app (an APK) and publishes it as a release.
# The Android project may sit at the top of the repository or in a folder such
# as Inkwell-Android/: the second step finds it by its settings.gradle.

on:
  push:
    branches: [ main, 'claude/**' ]
    # Changes that only touch the iPhone, iPad or web versions do not rebuild the APK.
    paths-ignore:
      - 'Inkwell-iOS/**'
      - 'Inkwell-Web/**'
      - 'artwork/**'
      - 'Inkwell-Mac/**'
      - 'Inkwell-Windows/**'
      - 'packaging/**'
      - '.github/workflows/ios.yml'
      - '.github/workflows/web.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the project
        uses: actions/checkout@v4

      - name: Find the Android project
        run: |
          set -euo pipefail
          dir="$(find . -maxdepth 3 -name settings.gradle -not -path './.git/*' -printf '%h\n' | sort | head -n 1)"
          if [ -z "$dir" ]; then
            echo "::error::No settings.gradle in this repository. Upload the Inkwell-Android folder, or everything inside it."
            exit 1
          fi
          dir="${dir#./}"
          version="$(sed -n "s/^[[:space:]]*versionName[[:space:]]*['\"]\([^'\"]*\)['\"].*/\1/p" "$dir/app/build.gradle" | head -n 1)"
          {
            echo "PROJECT_DIR=$dir"
            echo "INKWELL_VERSION=${version:-unknown}"
            echo "APK_NAME=Inkwell-${version:-unknown}-build${{ github.run_number }}.apk"
          } >> "$GITHUB_ENV"
          echo "Android project found in: $dir (version ${version:-unknown})"

      # The Android SDK comes preinstalled on GitHub's Ubuntu runners (ANDROID_HOME),
      # and the Android Gradle plugin fetches any missing platform it needs.
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 7.35: the tablet's writing model is built from llama.cpp (MIT
      # licence) at a fixed release, the one Inkwell's tests were run against
      - name: Fetch llama.cpp for the tablet's model
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          dest=app/src/main/cpp/llama.cpp
          if [ ! -f "$dest/CMakeLists.txt" ]; then
            rm -rf "$dest"
            git clone --depth 1 --branch b11398 https://github.com/ggml-org/llama.cpp "$dest"
          fi
          git -C "$dest" log -1 --format='llama.cpp %h %cd' || true

      # 7.42: in a PUBLIC repository the signing key must not be a file. Keep
      # the keystore, base64-encoded, in the repository secret
      # INKWELL_KEYSTORE_B64 and the three lines of signing.properties
      # (storePassword, keyPassword, keyAlias) in INKWELL_SIGNING_PROPERTIES;
      # this step writes the two files the build reads (Settings, Secrets and
      # variables, Actions, New repository secret; on a Mac the first value is
      # made with: base64 -i signing/inkwell.jks | tr -d '\n' | pbcopy).
      # With neither the files nor the secrets, the APK is signed with the
      # Android test key and named -TESTKEY: it installs on a tablet with no
      # Inkwell, but not over an Inkwell signed with the real key.
      - name: Write the signing key from the repository's secrets
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          INKWELL_KEYSTORE_B64: ${{ secrets.INKWELL_KEYSTORE_B64 }}
          INKWELL_SIGNING_PROPERTIES: ${{ secrets.INKWELL_SIGNING_PROPERTIES }}
        run: |
          set -euo pipefail
          if [ -f signing/inkwell.jks ] && [ -f signing/signing.properties ]; then
            echo "Signing with the key in signing/."
          elif [ -n "$INKWELL_KEYSTORE_B64" ] && [ -n "$INKWELL_SIGNING_PROPERTIES" ]; then
            mkdir -p signing
            printf '%s' "$INKWELL_KEYSTORE_B64" | tr -d ' \n\r' | base64 -d > signing/inkwell.jks
            printf '%s\n' "$INKWELL_SIGNING_PROPERTIES" > signing/signing.properties
            echo "Signing with the key from the repository's secrets."
          else
            echo "::warning::No signing key: no signing/ folder and no INKWELL_KEYSTORE_B64 secret. The APK is signed with the Android test key; it installs on a tablet with no Inkwell, but not over an Inkwell signed with the real key."
            echo "APK_NAME=${APK_NAME%.apk}-TESTKEY.apk" >> "$GITHUB_ENV"
          fi

      - name: Build the APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace assembleRelease 2>&1 | tee build_log.txt

      - name: Name the APK, and check the model engine is inside it
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/release/app-release.apk "$APK_NAME"
          unzip -l "$APK_NAME" | grep -E 'lib/(arm64-v8a|x86_64)/' | awk '{print $1, $4}'
          for f in lib/arm64-v8a/libinkllm.so lib/arm64-v8a/libllama.so lib/arm64-v8a/libggml-base.so; do
            unzip -l "$APK_NAME" | grep -q "$f" || { echo "::error::$f is missing from the APK"; exit 1; }
          done
          unzip -l "$APK_NAME" | grep -q 'lib/arm64-v8a/libggml-cpu' || { echo "::error::no processor variant of the engine in the APK"; exit 1; }

      - name: Keep the APK with this run
        uses: actions/upload-artifact@v4
        with:
          name: Inkwell-APK
          path: ${{ env.PROJECT_DIR }}/${{ env.APK_NAME }}
          if-no-files-found: error

      - name: Publish a release you can download
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="build-${{ github.run_number }}"
          title="Inkwell ${INKWELL_VERSION} (build ${{ github.run_number }})"
          notes="To install on the Fire tablet by USB: download the .apk under Assets on your computer, connect the tablet with its cable, and copy the file into the tablet's Download folder. On the tablet, open the Files app, tap the file, then Install. Each build installs over the previous one and keeps your documents. Built from commit ${{ github.sha }}."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$APK_NAME" --clobber
          else
            gh release create "$tag" "$APK_NAME" --target "${{ github.sha }}" --title "$title" --notes "$notes"
          fi

      - name: Keep the build log, pass or fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ env.PROJECT_DIR }}/build_log.txt
          if-no-files-found: ignore

  # 7.35: the tablet's model, tested on an Android emulator: the real model
  # downloaded and checked, started in its own process, answering, stopping,
  # surviving the system closing it, and Check in the page using it. About
  # half an hour, so it runs when asked: a commit message containing
  # [emulator], or "Run workflow".
  emulator-test:
    needs: build
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[emulator]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out the project
        uses: actions/checkout@v4

      # The emulator needs about 1.2 times its disk size free. After the native
      # build the machine had 4.8 GB, so the emulator refused to start. These
      # preinstalled toolchains are not used by this job.
      - name: Make room on the build machine for the emulator
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/share/swift /usr/local/share/powershell /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Find the Android project
        run: |
          dir="$(find . -maxdepth 3 -name settings.gradle -not -path './.git/*' -printf '%h\n' | sort | head -n 1)"
          echo "PROJECT_DIR=${dir#./}" >> "$GITHUB_ENV"

      - name: Fetch llama.cpp for the tablet's model
        working-directory: ${{ env.PROJECT_DIR }}
        run: git clone --depth 1 --branch b11398 https://github.com/ggml-org/llama.cpp app/src/main/cpp/llama.cpp

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Allow the emulator to use the processor's virtualisation
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build the app and its tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon assembleDebug assembleDebugAndroidTest

      - name: Run the tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          ram-size: 4096M
          disk-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: ${{ env.PROJECT_DIR }}
          script: |
            adb logcat -c || true
            gradle --no-daemon connectedDebugAndroidTest || (adb logcat -d > emulator_logcat.txt; exit 1)
            adb logcat -d > emulator_logcat.txt

      - name: Keep the test results and the device log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-test
          path: |
            ${{ env.PROJECT_DIR }}/app/build/reports/androidTests
            ${{ env.PROJECT_DIR }}/app/build/outputs/androidTest-results
            ${{ env.PROJECT_DIR }}/emulator_logcat.txt
          if-no-files-found: ignore
