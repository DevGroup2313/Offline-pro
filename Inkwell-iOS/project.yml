# Inkwell for iPhone and iPad. XcodeGen turns this file into Inkwell.xcodeproj
# on GitHub's Mac runner; no Xcode is needed on your own computer.
# The "web" folder is filled by the workflow from Inkwell-Android's assets,
# so both apps always carry the same Inkwell.html.
name: Inkwell
options:
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    MARKETING_VERSION: "7.50"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Inkwell:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
      - path: web
        type: folder
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Inkwell
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: Scriba uses the microphone to record and transcribe what you say.
        NSLocalNetworkUsageDescription: Inkwell connects to your own laptop on this Wi-Fi to use its writing model.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # 7.50: Inkwell is offered for a document on the phone or tablet
        # (Open in, Share): Word files into Tabula, PDFs and the rest onto the desk
        CFBundleDocumentTypes:
          - CFBundleTypeName: Word document
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [org.openxmlformats.wordprocessingml.document, com.microsoft.word.doc]
          - CFBundleTypeName: PDF document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf]
          - CFBundleTypeName: Text document
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.plain-text, net.daringfireball.markdown, public.rtf, org.oasis-open.opendocument.text, public.html]
        LSSupportsOpeningDocumentsInPlace: false
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.inkwell.app
        PRODUCT_NAME: Inkwell
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: "NO"
        # Built unsigned: Sideloadly signs it with your Apple ID when it installs.
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
