<script id="cd-sdark-follow">(function(){
function L(c){var m=(c||'').match(/(\d+)[,\s]+(\d+)[,\s]+(\d+)/);return m?(+m[1]*.299+ +m[2]*.587+ +m[3]*.114):null;}
function darkNow(){try{
/* measure a themed CONTENT element's text colour, one this dress never restyles.
   Light text => the app is rendering dark. Robust to whatever trigger the frame uses. */
var el=document.querySelector('.sheet td,.rib-tab,.tab,label,.sub,.hint,.status,p')||document.body;
var lum=L(getComputedStyle(el).color);
if(lum==null)return null; return lum>140;
}catch(e){return null;}}
function paint(list,ref){for(var j=0;j<list.length;j++){var e=document.querySelectorAll(list[j]);for(var i=0;i<e.length;i++){
e[i].style.setProperty('background',ref,'important');
e[i].style.setProperty('border-top','0','important');
e[i].style.setProperty('box-shadow','none','important');}}}
function foot(){try{
/* Keep the footer BANDLESS, like Tabula: the status bar carries no strip of its own, so
   whatever it shows sits on the page. Gated on the app's own elements so Tabula, which owns
   the reference look, is never touched. The grid and the sheet keep their own colours; this
   routine no longer repaints them. */
var isAb=!!document.getElementById('abStatus');
var isIm=!isAb && !!document.querySelector('.stage');
if(!isAb && !isIm) return;
var bar=document.getElementById('abStatus')||document.querySelector('.statusbar');
if(!bar) return;
bar.style.setProperty('background','transparent','important');
bar.style.setProperty('border-top','0','important');
bar.style.setProperty('box-shadow','none','important');
}catch(e){}}
function tick(){var d=darkNow();if(d!=null){var r=document.documentElement;if(d){if(!r.classList.contains('cd-sdark'))r.classList.add('cd-sdark');}else{if(r.classList.contains('cd-sdark'))r.classList.remove('cd-sdark');}}foot();}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',tick);else tick();
setInterval(tick,350);
try{var mo=new MutationObserver(tick);mo.observe(document.documentElement,{attributes:true,attributeFilter:['class','data-theme','style']});mo.observe(document.body,{attributes:true,attributeFilter:['class','data-theme','style']});}catch(e){}
})();</script>

/* ================= 7.29: ON-DEVICE WHISPER =================
   Whisper running inside the page, for every device without Inkwell's local
   server: the Fire app, iPad and iPhone, Silk, and a desktop without the
   Python libraries. It runs in a background worker, so the page and the
   microphone capture never stall while it thinks. The model is fetched once,
   on the first Record press, and kept by the browser for offline use. */
var PAGE={worker:null, ready:false, loading:false, error:null, model:null, seq:0, waits:{}, mb:0, onReady:[]};
var SCRIBA_PAGE_MODELS=["onnx-community/whisper-tiny","Xenova/whisper-tiny"];
var SCRIBA_WORKER_SRC=[
 "let TF=null, pipe=null, loading=null;",
 "async function load(urls, models){",
 "  if(pipe) return pipe;",
 "  let lastErr=null;",
 "  for (const u of urls){ try { TF=await import(u.module); if(u.wasm){ TF.env.backends.onnx.wasm.wasmPaths=u.wasm; } break; } catch(e){ lastErr=e; TF=null; } }",
 "  if(!TF) throw new Error('the speech library could not be loaded ('+String(lastErr&&lastErr.message||lastErr)+')');",
 "  if(typeof TF.pipeline!=='function') throw new Error('the speech library has no pipeline function');",
 "  for (const id of models){",
 "    try { pipe=await TF.pipeline('automatic-speech-recognition', id, { progress_callback:(p)=>postMessage({type:'progress', file:p.file||'', loaded:p.loaded||0, total:p.total||0, status:p.status||''}) });",
 "      postMessage({type:'model', id:id}); return pipe; }",
 "    catch(e){ lastErr=e; }",
 "  }",
 "  throw new Error('the Whisper model could not be fetched ('+String(lastErr&&lastErr.message||lastErr)+')');",
 "}",
 "onmessage=async(ev)=>{ const m=ev.data||{};",
 "  try {",
 "    if(m.type==='probe'){ let ok=false, v=''; for(const u of m.urls){ try{ const t=await import(u.module); ok=typeof t.pipeline==='function'; v=(t.env&&t.env.version)||''; break; }catch(e){} } postMessage({type:'probe', ok:ok, version:v}); return; }",
 "    loading=loading||load(m.urls, m.models);",
 "    const p=await loading;",
 "    if(m.type==='load'){ postMessage({type:'ready'}); return; }",
 "    if(m.type==='run'){ const out=await p(m.audio, m.opts); postMessage({type:'result', id:m.id, text:String((out&&out.text)||'').trim()}); }",
 "  } catch(e){ loading=null; pipe=null; postMessage({type:'error', id:m.id, message:String(e&&e.message||e)}); }",

function scribaPageOk(){
  return secure && typeof WebAssembly==="object" && typeof Worker==="function" && typeof Blob==="function" && !!(window.URL&&URL.createObjectURL);

function scribaPageUrls(){

}

  var files={};
  w.onmessage=function(ev){
    var m=ev.data||{};

      if(m.file){ files[m.file]=m.loaded||files[m.file]||0; }

      return;
    }
    if(m.type==="model"){ PAGE.model=m.id; return; }
    if(m.type==="ready"){ if(PAGE.loading){ say(T("On-device Whisper is ready. Speak; each phrase appears a moment after you pause.","Whisper sur l\u2019appareil est pr\u00eat. Parlez ; chaque phrase appara\u00eet un instant apr\u00e8s une pause.")); } PAGE.ready=true; PAGE.loading=false; PAGE.error=null; var r=PAGE.onReady; PAGE.onReady=[]; r.forEach(function(f){try{f(null);}catch(e){}}); return; }

        var r2=PAGE.onReady; PAGE.onReady=[]; r2.forEach(function(f){try{f(m.message);}catch(e){}}); }

/* load once; cb(err) */
function scribaPageLoad(cb){

/* ---- Loudness -------------------------------------------------------------
   Three separate things, because "too quiet" has three separate causes: what the
   microphone hands over, whether the reader can tell, and what can be done about a
   recording already made. */

function cdMicWants() {
  /* Preferences, not demands. Written as plain booleans rather than {exact:true} so
     a device that cannot offer one ignores it instead of refusing the microphone. */
  return {
    autoGainControl: true,
    noiseSuppression: true,
    echoCancellation: true
  };
}

var cdAC = null;
function cdAudioCtx() {
  if (cdAC) return cdAC;
  try {
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return null;
    cdAC = new C();
  } catch (e) { cdAC = null; }
  return cdAC;
}

/* The meter. It reads the stream that is being recorded, so it shows what is
   actually going down rather than a separate guess at it. */
var cdMeterStop = null;
function cdMeterStart(stream) {
  var ctx = cdAudioCtx();
  var wrap = document.getElementById("cdLevelWrap");
  var bar = document.getElementById("cdLevelBar");
  if (!ctx || !wrap || !bar) return;
  try { if (ctx.state === "suspended") ctx.resume(); } catch (e) {}
  var src, an, buf, raf = null, quietSince = Date.now(), warned = false;
  try {
    src = ctx.createMediaStreamSource(stream);
    an = ctx.createAnalyser();
    an.fftSize = 1024;
    an.smoothingTimeConstant = 0.75;
    src.connect(an);
    buf = new Uint8Array(an.fftSize);
  } catch (e) { return; }
  wrap.style.display = "block";

  function frame() {
    try {
      an.getByteTimeDomainData(buf);
      /* Root mean square rather than peak: a single click should not fill the bar. */
      var sum = 0;
      for (var i = 0; i < buf.length; i++) {
        var v = (buf[i] - 128) / 128;
        sum += v * v;
      }
      var rms = Math.sqrt(sum / buf.length);
      /* A voice sits low on a linear scale, so the bar is drawn on a curve that
         gives ordinary speech most of the width. */
      var shown = Math.min(1, Math.pow(rms * 3.2, 0.6));
      bar.style.width = Math.round(shown * 100) + "%";
      bar.style.background = (rms < 0.012) ? "#9a9a9f" : (rms > 0.55 ? "#822e1d" : "#1B6B93");
      if (rms >= 0.012) { quietSince = Date.now(); warned = false; }
      else if (!warned && Date.now() - quietSince > 4000) {
        warned = true;
        say(L.tooQuiet);
      }
    } catch (e) {}
    raf = requestAnimationFrame(frame);
  }
  frame();

  cdMeterStop = function () {
    try { if (raf) cancelAnimationFrame(raf); } catch (e) {}
    try { src.disconnect(); } catch (e) {}
    try { wrap.style.display = "none"; bar.style.width = "0%"; } catch (e) {}
    cdMeterStop = null;
  };
}

/* Boost. An <audio> element's volume cannot exceed 1, so a quiet recording cannot be
   made louder by it. Routing playback through a gain node can. */
var cdBoostSrc = null, cdBoostGain = null;
var cdBoostLevels = [1, 2, 3.2];
var cdBoostAt = 0;
try {
  var saved = parseInt(localStorage.getItem("cd_scriba_boost") || "0", 10);
  if (saved >= 0 && saved < cdBoostLevels.length) cdBoostAt = saved;
} catch (e) {}

function cdBoostApply() {
  var btn = document.getElementById("cdBoostBtn");
  var el = document.getElementById("capAudio");
  var wanted = cdBoostLevels[cdBoostAt];
  if (btn) {
    btn.textContent = (cdBoostAt === 0) ? L.boostOff : (L.boostOn + " \u00d7" + wanted);
    btn.setAttribute("aria-pressed", String(cdBoostAt > 0));
  }
  if (!el) return;
  if (wanted <= 1) {
    if (cdBoostGain) { try { cdBoostGain.gain.value = 1; } catch (e) {} }
    return;
  }
  var ctx = cdAudioCtx();
  if (!ctx) return;
  try {
    if (!cdBoostSrc) {
      /* createMediaElementSource may be called only once per element, so the graph
         is built on first use and then only its gain is changed. */
      cdBoostSrc = ctx.createMediaElementSource(el);
      cdBoostGain = ctx.createGain();
      cdBoostSrc.connect(cdBoostGain);
      cdBoostGain.connect(ctx.destination);
    }
    if (ctx.state === "suspended") ctx.resume();
    cdBoostGain.gain.value = wanted;
  } catch (e) {}
}

function recDel(id, cb) { sdbOpen(function (db) { if (!db) { memRecs = memRecs.filter(function (x) { return x.id !== id; }); cb && cb(); return; } try { var tx = db.transaction("recordings", "readwrite"); tx.objectStore("recordings").delete(id); tx.oncomplete = function () { cb && cb(); }; tx.onerror = function () { cb && cb(); }; } catch (e) { cb && cb(); } }); }
function fmtDur(ms) { var s = Math.round((ms || 0) / 1000); var mm = Math.floor(s / 60); s = s % 60; return mm + ":" + (s < 10 ? "0" : "") + s; }
function renderRecordings() { var host = document.getElementById("recList"); if (!host) return; var q = (document.getElementById("recSearch").value || "").toLowerCase(); recAll(function (list) { list.sort(function (a, b) { return b.ts - a.ts; }); var shown = list.filter(function (r) { return !q || (r.name || "").toLowerCase().indexOf(q) >= 0; }); host.innerHTML = ""; if (!shown.length) { var e = document.createElement("div"); e.style.cssText = "font-size:12.5px;color:var(--ink-2);font-style:italic;padding:6px 0"; e.textContent = L.recEmpty; host.appendChild(e); return; } shown.forEach(function (r) { var row = document.createElement("div"); row.style.cssText = "display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 0;border-top:1px solid var(--line)"; var nm = document.createElement("div"); nm.style.cssText = "font-size:13px;font-weight:600;flex:1;min-width:120px;font-family:var(--serif)"; nm.textContent = r.name; var meta = document.createElement("div"); meta.style.cssText = "font-size:11px;color:var(--ink-2)"; var dt = new Date(r.ts); meta.textContent = dt.toLocaleDateString() + " \u00b7 " + fmtDur(r.dur); function mkBtn(label, fn) { var b = document.createElement("button"); b.type = "button"; b.textContent = label; b.style.cssText = "font-size:11.5px;padding:5px 9px"; b.onclick = fn; return b; } row.appendChild(nm); row.appendChild(meta); row.appendChild(mkBtn(L.playLbl, function () { try { capAudio.src = URL.createObjectURL(r.blob); capAudio.style.display = "block"; capAudio.play(); } catch (e) {} })); row.appendChild(mkBtn(L.renameLbl, function () { var nn = prompt(L.renamePrompt, r.name); if (nn != null && nn.trim()) { r.name = nn.trim(); recPut(r, renderRecordings); } })); row.appendChild(mkBtn(L.exportLbl, function () { try { var a = document.createElement("a"); a.href = URL.createObjectURL(r.blob); a.download = (r.name || "recording").replace(/[^\w\- ]+/g, "") + ".webm"; document.body.appendChild(a); a.click(); document.body.removeChild(a); } catch (e) {} })); row.appendChild(mkBtn(L.transcribeLbl, function () { cdTranscribe(r); })); row.appendChild(mkBtn(L.deleteLbl, function () { recDel(r.id, renderRecordings); })); host.appendChild(row); }); }); }
try { document.getElementById("recTitle").textContent = L.recTitle; document.getElementById("recSearch").setAttribute("placeholder", L.recSearch); document.getElementById("recSearch").addEventListener("input", renderRecordings); renderRecordings(); } catch (e) {}
/* Transcribe all recordings */
try{
  var taBtn=document.getElementById("transcribeAllBtn");
  taBtn.textContent=FR?"Tout transcrire":"Transcribe all";
  taBtn.onclick=function(){
    recAll(function(list){
      if(!list.length){ say(FR?"Aucun enregistrement.":"No recordings."); return; }
      var idx=0;
      taBtn.disabled=true; taBtn.textContent=FR?"Transcription en cours\\u2026 (0/"+list.length+")":"Transcribing\\u2026 (0/"+list.length+")";
      function next(){
        if(idx>=list.length){ taBtn.disabled=false; taBtn.textContent=FR?"Tout transcrire":"Transcribe all"; say(FR?"Toutes les transcriptions ajout\\u00e9es.":"All transcripts added."); return; }
        var r=list[idx]; idx++;
        taBtn.textContent=FR?"Transcription en cours\\u2026 ("+idx+"/"+list.length+")":"Transcribing\\u2026 ("+idx+"/"+list.length+")";
        cdTranscribe({
          blob:r.blob, name:r.name, dur:r.dur,
          _after:function(){
            setTimeout(next,300);
          }
        });
      }
      next();
    });
  };
  /* Show the button when recordings exist */
  var taObs=new MutationObserver(function(){
    var rl=document.getElementById("recList");
    taBtn.style.display=(rl&&rl.children.length>0&&rl.firstChild.className!=="")?"inline-block":"none";
  });
  taObs.observe(document.getElementById("recList"),{childList:true});
}catch(e){}
function scribaTab(which) {
  var dict = which !== "recordings";
  function sh(el2, on) { if (el2) el2.style.display = on ? "" : "none"; }
  sh(document.querySelector(".bar"), dict);
  sh(document.getElementById("status"), dict);
  sh(document.getElementById("pad"), dict);
  sh(document.getElementById("hintLine"), dict);
  sh(document.getElementById("recWrap"), !dict);
  var ca = document.getElementById("capAudio");
  if (ca) { if (dict) ca.style.display = "none"; else if (ca.getAttribute("src")) ca.style.display = "block"; }
  var db = document.getElementById("tabDictateBtn"), rb = document.getElementById("tabRecBtn");
  if (db) { db.classList.toggle("tabsel", dict); db.setAttribute("aria-selected", dict ? "true" : "false"); }
  if (rb) { rb.classList.toggle("tabsel", !dict); rb.setAttribute("aria-selected", dict ? "false" : "true"); }
  if (!dict) { try { renderRecordings(); } catch (e) {} }
}
/* 7.30: inside Inkwell, Scriba's pad goes straight into the open document too,
   at the caret, beside "Send to Tabula" */
if (window.parent !== window && window.__CD_NOCLOSE && !window.__INK_SCRIBA_RELAY && !window.__INK_SCRIBA_FOR_TABULA) {
  (function () {
    var b = document.createElement("button"); b.type = "button"; b.id = "toDesk";
    b.textContent = FR ? "Dans le document" : "Into the document";
    b.title = FR ? "Ins\u00e9rer le texte dict\u00e9 dans le document d\u2019Inkwell, au curseur" : "Put the dictated text into Inkwell\u2019s document, at the caret";
    b.onclick = function () {
      var said = (pad.innerText || "").trim();
      if (!said) { say(FR ? "Rien \u00e0 ins\u00e9rer pour l\u2019instant." : "Nothing to insert yet."); return; }
      try { parent.postMessage({ kind: "ink-scriba-to-desk", text: said }, "*"); } catch (e) {}
      say(FR ? "Dans le document." : "In the document.");
    };
    var tt = document.getElementById("toTabula"); tt.parentNode.insertBefore(b, tt);
  })();
}
/* 7.30: relay mode. Inside Inkwell, Tabula's microphone dictates straight onto
   Tabula's page. Inkwell runs this Scriba out of sight with __INK_SCRIBA_RELAY
   set: every finished phrase (from whichever engine this device has: the local
   server, on-device Whisper or the browser's own) is handed to Inkwell instead
   of being written into Scriba's pad, so the pad and its saved copy are never
   touched, and Inkwell starts and stops the dictation. */
if (window.__INK_SCRIBA_RELAY) {
  appendText = function (t) {
    t = punctuate(String(t || "").trim());
    if (!t) return;
    try { parent.postMessage({ kind: "ink-dictate-text", text: t }, "*"); } catch (e) {}
  };
  var relaySay = say;
  say = function (t) {
    relaySay(t);
    try { parent.postMessage({ kind: "ink-dictate-status", text: String(t || "") }, "*"); } catch (e) {}
    /* "Stopped." is said once the last queued phrase has been written: Inkwell
       accepts phrases until then, and nothing after */
    if (t === L.stopped) { try { parent.postMessage({ kind: "ink-dictate-idle" }, "*"); } catch (e) {} }
  };
  window.addEventListener("message", function (ev) {
    var d = ev && ev.data;
    if (!d || d.kind !== "ink-dictate") return;
    if (d.lang) { try { langSel.value = d.lang; } catch (e) {} }
    var want = !!d.on, tries = 0;
    (function go() {
      if (want === !!live) { cdPostLive(); return; }
      /* the engine check runs at load; pressing Record before it ends only says "still checking" */
      if (want && !STT.checked && tries++ < 60) { setTimeout(go, 250); return; }
      recBtn.click();
      setTimeout(cdPostLive, 600);
    })();
  });
}
try { document.getElementById("tabDictateBtn").onclick = function () {
