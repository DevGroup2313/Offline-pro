<script id="cd-sdark-follow">(function(){
function L(c){var m=(c||'').match(/(\d+)[,\s]+(\d+)[,\s]+(\d+)/);return m?(+m[1]*.299+ +m[2]*.587+ +m[3]*.114):null;}
function darkNow(){try{
/* measure a themed CONTENT element's text colour, one this dress never restyles.
   Light text => the app is rendering dark. Robust to whatever trigger the frame uses. */
var el=document.querySelector('.sheet td,.rib-tab,.tab,label,.sub,.hint,.status,p')||document.body;
var lum=L(getComputedStyle(el).color);
if(lum==null)return null; return lum>140;
}catch(e){return null;}}
function paint(list,ref){for(var j=0;j<list.length;j++){var e=document.querySelectorAll(list[j]);for(var i=0;i<e.length;i++){
e[i].style.setProperty('background',ref,'important');
e[i].style.setProperty('border-top','0','important');
e[i].style.setProperty('box-shadow','none','important');}}}
function foot(){try{
/* Keep the footer BANDLESS, like Tabula: the status bar carries no strip of its own, so
   whatever it shows sits on the page. Gated on the app's own elements so Tabula, which owns
   the reference look, is never touched. The grid and the sheet keep their own colours; this
   routine no longer repaints them. */
var isAb=!!document.getElementById('abStatus');
var isIm=!isAb && !!document.querySelector('.stage');
if(!isAb && !isIm) return;
var bar=document.getElementById('abStatus')||document.querySelector('.statusbar');
if(!bar) return;
bar.style.setProperty('background','transparent','important');
bar.style.setProperty('border-top','0','important');
bar.style.setProperty('box-shadow','none','important');
}catch(e){}}
function tick(){var d=darkNow();if(d!=null){var r=document.documentElement;if(d){if(!r.classList.contains('cd-sdark'))r.classList.add('cd-sdark');}else{if(r.classList.contains('cd-sdark'))r.classList.remove('cd-sdark');}}foot();}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',tick);else tick();
setInterval(tick,350);
try{var mo=new MutationObserver(tick);mo.observe(document.documentElement,{attributes:true,attributeFilter:['class','data-theme','style']});mo.observe(document.body,{attributes:true,attributeFilter:['class','data-theme','style']});}catch(e){}
})();</script>

<style>

  @keyframes sp{0%{box-shadow:0 0 0 0 rgba(224,82,82,0.55);}70%{box-shadow:0 0 0 9px rgba(224,82,82,0);}100%{box-shadow:0 0 0 0 rgba(224,82,82,0);}}

#scribaTabs{display:inline-flex;margin:0 0 12px;border:1px solid var(--line);border-radius:8px;overflow:hidden;}

/* ---- Loudness -------------------------------------------------------------
   Three separate things, because "too quiet" has three separate causes: what the
   microphone hands over, whether the reader can tell, and what can be done about a
   recording already made. */

function cdMicWants() {

     a device that cannot offer one ignores it instead of refusing the microphone. */
  return {

}

var cdAC = null;
function cdAudioCtx() {

/* The meter. It reads the stream that is being recorded, so it shows what is
   actually going down rather than a separate guess at it. */
var cdMeterStop = null;
function cdMeterStart(stream) {
  var ctx = cdAudioCtx();
  var wrap = document.getElementById("cdLevelWrap");
  var bar = document.getElementById("cdLevelBar");
  if (!ctx || !wrap || !bar) return;
  try { if (ctx.state === "suspended") ctx.resume(); } catch (e) {}
  var src, an, buf, raf = null, quietSince = Date.now(), warned = false;
  try {
    src = ctx.createMediaStreamSource(stream);
    an = ctx.createAnalyser();
    an.fftSize = 1024;
    an.smoothingTimeConstant = 0.75;
    src.connect(an);
    buf = new Uint8Array(an.fftSize);
  } catch (e) { return; }
  wrap.style.display = "block";

  function frame() {
    try {
      an.getByteTimeDomainData(buf);
      /* Root mean square rather than peak: a single click should not fill the bar. */
      var sum = 0;
      for (var i = 0; i < buf.length; i++) {
        var v = (buf[i] - 128) / 128;
        sum += v * v;
      }
      var rms = Math.sqrt(sum / buf.length);
      /* A voice sits low on a linear scale, so the bar is drawn on a curve that
         gives ordinary speech most of the width. */
      var shown = Math.min(1, Math.pow(rms * 3.2, 0.6));
      bar.style.width = Math.round(shown * 100) + "%";
      bar.style.background = (rms < 0.012) ? "#9a9a9f" : (rms > 0.55 ? "#822e1d" : "#1B6B93");

    try { src.disconnect(); } catch (e) {}
    try { wrap.style.display = "none"; bar.style.width = "0%"; } catch (e) {}

  };

  var btn = document.getElementById("cdBoostBtn");
  var el = document.getElementById("capAudio");
  var wanted = cdBoostLevels[cdBoostAt];
  if (btn) {

    var b = document.createElement("button"); b.type = "button"; b.className = "slideTh"; b.title = sl.name + (sl.at != null ? " · " + sessFmt(sl.at) : "");
    b.innerHTML = '<img alt="" src="' + u + '"><span>' + (sl.at != null ? sessFmt(sl.at) : "") + "</span>";
    b.onclick = function () { sessSlideView(list, k); }; host.appendChild(b);
  });
}
function sessSlideView(list, k) {
  var r = SESS.rec, ov = document.createElement("div"); ov.className = "slideView"; ov.setAttribute("role", "dialog");
  var url = null;
  function show() {
    if (url) URL.revokeObjectURL(url); var sl = list[k]; url = URL.createObjectURL(sl.blob);
    ov.innerHTML = '<div class="svBar"><span class="svName"></span><span class="sp"></span>'
      + (sl.at != null ? '<button type="button" data-v="jump">' + sessEsc(sessT("Play from ", "Lire à ") + sessFmt(sl.at)) + "</button>" : "")
      + '<button type="button" data-v="here">' + sessEsc(sessT("Tie to this moment", "Lier à ce moment")) + '</button><button type="button" data-v="del">' + sessEsc(sessT("Remove", "Retirer")) + '</button><button type="button" data-v="x">×</button></div>'
      + '<div class="svImg"><button type="button" data-v="prev" aria-label="' + sessEsc(sessT("Previous", "Précédente")) + '">‹</button><img alt=""><button type="button" data-v="next" aria-label="' + sessEsc(sessT("Next", "Suivante")) + '">›</button></div>';
    ov.querySelector(".svName").textContent = sl.name + "  (" + (k + 1) + " / " + list.length + ")";
    ov.querySelector("img").src = url;
    ov.querySelectorAll("[data-v]").forEach(function (b) { b.onclick = function () { var v = b.getAttribute("data-v");
      if (v === "x") close(); else if (v === "prev") { k = (k - 1 + list.length) % list.length; show(); } else if (v === "next") { k = (k + 1) % list.length; show(); }
      else if (v === "jump" && SESS.media) { SESS.media.currentTime = sl.at + 0.01; close(); }
      else if (v === "here" && SESS.media) { sl.at = Math.round(SESS.media.currentTime * 10) / 10; recPut(r); sessSlidesRender(); show(); }
      else if (v === "del") { r.slides = (r.slides || []).filter(function (x) { return x.id !== sl.id; }); recPut(r); sessSlidesRender(); close(); } }; });
  }
  function close() { if (url) URL.revokeObjectURL(url); ov.remove(); document.removeEventListener("keydown", key); }
  function key(e) { if (e.key === "Escape") close(); else if (e.key === "ArrowLeft") { k = (k - 1 + list.length) % list.length; show(); } else if (e.key === "ArrowRight") { k = (k + 1) % list.length; show(); } }
  document.addEventListener("keydown", key); show(); document.body.appendChild(ov);
}
/* ---- the recordings list: open, and import ---- */
(function () {
  var ib = document.getElementById("recImportBtn"), inp = document.getElementById("recImportFile");
  if (ib && inp) {
    ib.textContent = sessT("Import audio or video", "Importer un audio ou une vidéo");
    ib.title = sessT("Add a recording or a video from this device; it is transcribed on the device", "Ajouter un enregistrement ou une vidéo de cet appareil ; transcription sur l’appareil");
    ib.onclick = function () { inp.value = ""; inp.click(); };
    inp.onchange = function () {
      var files = [].slice.call(inp.files || []); if (!files.length) return;
      var made = [];
      (function next() {
        if (!files.length) { renderRecordings(); if (made.length) { made[0]._autoTx = true; sessOpen(made[0]); } return; }
        var f = files.shift(), r = { id: "imp" + Date.now() + Math.random().toString(36).slice(2, 7), name: f.name.replace(/\.[^.]+$/, ""), ts: Date.now(), dur: 0, blob: f, imported: true };
        var probe = document.createElement(/^video\//.test(f.type) ? "video" : "audio"); probe.preload = "metadata";
        var settled = false; function put() { if (settled) return; settled = true; try { URL.revokeObjectURL(probe.src); } catch (e) {} recPut(r, function () { made.push(r); next(); }); }
        probe.onloadedmetadata = function () { if (isFinite(probe.duration)) r.dur = Math.round(probe.duration * 1000); put(); };
        probe.onerror = put; setTimeout(put, 4000);
        try { probe.src = URL.createObjectURL(f); } catch (e) { put(); }
      })();
    };
  }
})();
